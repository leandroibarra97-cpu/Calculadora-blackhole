<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calculadora Blackhole</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #0f172a;
    color: white;
}

.container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    height: 100vh;
}

.panel {
    padding: 25px;
}

.left {
    background: #020617;
}

.right {
    background: #0f172a;
}

h1 {
    margin-bottom: 20px;
}

input, select {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 8px;
    border: none;
}

.card {
    background: #020617;
    padding: 20px;
    border-radius: 10px;
    margin-top: 20px;
}

.slider {
    width: 100%;
}

button {
    background: #22c55e;
    border: none;
    padding: 12px;
    width: 100%;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #16a34a;
}
</style>
</head>

<body>

<div class="container">

<div class="panel left">
    <h1>Configuración</h1>

    <label>Largo (cm)</label>
    <input type="number" id="largo" value="120">

    <label>Ancho (cm)</label>
    <input type="number" id="ancho" value="60">

    <label>Alto (cm)</label>
    <input type="number" id="alto" value="75">

    <label>Madera</label>
    <select id="madera">
        <option value="24254">Paraíso</option>
        <option value="26000">Merlot</option>
        <option value="28000">Roble</option>
    </select>

    <label>Estructura</label>
    <select id="estructura">
        <option value="8000">Hierro 40x20</option>
        <option value="10000">Reforzado</option>
    </select>

    <label><input type="checkbox" id="cpu"> Soporte CPU (+15000)</label>
    <label><input type="checkbox" id="cajon"> Cajones (+20000)</label>

    <label>Margen</label>
    <input type="range" min="0" max="200" value="100" id="margen" class="slider">
    <p id="margenValor">100%</p>
</div>

<div class="panel right">
    <h1>Resultado</h1>

    <div class="card">
        <p>Costo: $ <span id="costo"></span></p>
        <p>Precio: $ <span id="precio"></span></p>
        <p>Ganancia: $ <span id="ganancia"></span></p>
    </div>

    <button onclick="copiar()">Copiar presupuesto</button>
</div>

</div>

<script>
function calcular() {
    let largo = largoInput.value / 100;
    let ancho = anchoInput.value / 100;
    let alto = altoInput.value / 100;

    let madera = parseFloat(maderaInput.value);
    let estructura = parseFloat(estructuraInput.value);
    let margen = margenInput.value;

    margenValor.innerText = margen + "%";

    let superficie = largo * ancho;
    let costoMadera = superficie * madera;
    let costoEstructura = (largo*2 + ancho*2 + alto*2) * estructura;

    let extras = 0;
    if(cpu.checked) extras += 15000;
    if(cajon.checked) extras += 20000;

    let costoTotal = costoMadera + costoEstructura + extras + 8000;
    let precio = costoTotal * (1 + margen / 100);

    costo.innerText = Math.round(costoTotal);
    precioFinal.innerText = Math.round(precio);
    ganancia.innerText = Math.round(precio - costoTotal);
}

function copiar(){
    let texto = `📐 Presupuesto

Medidas:
${largoInput.value}x${anchoInput.value}x${altoInput.value}

Precio: $${precioFinal.innerText}`;

    navigator.clipboard.writeText(texto);
    alert("Copiado");
}

const largoInput = document.getElementById("largo");
const anchoInput = document.getElementById("ancho");
const altoInput = document.getElementById("alto");
const maderaInput = document.getElementById("madera");
const estructuraInput = document.getElementById("estructura");
const margenInput = document.getElementById("margen");

document.querySelectorAll("input, select").forEach(el => {
    el.addEventListener("input", calcular);
});

calcular();

// Service Worker
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
